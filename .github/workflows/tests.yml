name: tests

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Explainable-RAG-Knowledge-Assistant-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Explainable-RAG-Knowledge-Assistant-Backend/requirements*.txt
      - run: pip install -r requirements-service.txt
      # LaBSE index is not committed, so dense-method tests skip; lexical/RRF/API tests run.
      - run: python -m unittest discover -s tests -v
        env:
          RAG_ENV: test
      - name: OpenAPI contract is up to date
        run: python scripts/export_openapi.py --check
